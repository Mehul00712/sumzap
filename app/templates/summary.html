{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-lg-10 mx-auto">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h1 class="h3 mb-0">Document Summary</h1>
                <a href="{{ url_for('main.index') }}" class="btn btn-light btn-sm">New Summary</a>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <h2 class="h4">Original Document: {{ document.filename }}</h2>
                    <p class="text-muted">Uploaded on: {{ document.upload_date.strftime('%Y-%m-%d %H:%M:%S') }}</p>
                </div>
                
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h3 class="h5 mb-0">AI-Generated Summary</h3>
                    </div>
                    <div class="card-body">
                        <div class="summary-content">
                            {{ document.summary|safe }}
                        </div>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Back to Home</a>
                    <button class="btn btn-success" onclick="window.print()">Print Summary</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
